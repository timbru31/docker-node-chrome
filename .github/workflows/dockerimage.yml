name: Test Docker image

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        variant: [default, slim, alpine]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build and test Docker image
        run: |
          # Determine the Docker build path
          if [ "${{ matrix.variant }}" = "default" ]; then
            VARIANT_PATH=""
            CHROMIUM_CMD="chromium"
          else
            VARIANT_PATH="/${{ matrix.variant }}"
            if [ "${{ matrix.variant }}" = "alpine" ]; then
              CHROMIUM_CMD="chromium-browser"
            else
              CHROMIUM_CMD="chromium"
            fi
          fi

          IMAGE_PATH="${{ matrix.node-version }}${VARIANT_PATH}"
          echo "Testing Node.js ${{ matrix.node-version }} (${{ matrix.variant }})"

          # Create a container and run tests
          CONTAINER_ID=$(docker create $(docker build -q ${IMAGE_PATH}) /bin/sh -c "
            node --version &&
            npm --version &&
            ${CHROMIUM_CMD} --version &&
            ${CHROMIUM_CMD} --headless --no-sandbox --disable-gpu --screenshot=/tmp/screenshot.png https://www.whatsmybrowser.org/
          ")

          docker start -a $CONTAINER_ID
          OUTPUT=$(docker logs $CONTAINER_ID)
          echo "$OUTPUT"

          # Copy screenshot from container
          mkdir -p screenshots
          docker cp $CONTAINER_ID:/tmp/screenshot.png screenshots/screenshot-node${{ matrix.node-version }}-${{ matrix.variant }}.png || true
          docker rm $CONTAINER_ID

          # Validate Node.js version
          if ! echo "$OUTPUT" | grep -q "v${{ matrix.node-version }}"; then
            echo "::error::Expected Node.js v${{ matrix.node-version }} but got different version"
            exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: screenshots-node${{ matrix.node-version }}-${{ matrix.variant }}
          path: screenshots/
          if-no-files-found: ignore

  auto-merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Automatically merge dependabot upgrades
        uses: fastify/github-action-merge-dependabot@v3.15.0
        with:
          target: minor
